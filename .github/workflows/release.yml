name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG but Cargo.toml says $version"; exit 1; }
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test (static binary)
        run: |
          bin=target/${{ matrix.target }}/release/whatchanged
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked|statically linked'
          "$bin" --version
          "$bin" --since 1d
      - name: Package
        run: |
          name="whatchanged-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/whatchanged README.md LICENSE doc/whatchanged.1 "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: whatchanged-*.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # The packaging script comes from the branch the workflow runs on,
      # so packages can also be added to an older tag's release.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Build .deb and .rpm packages
        run: |
          command -v rpmbuild >/dev/null || { sudo apt-get update -q; sudo apt-get install -y -q rpm; }
          packaging/build-packages.sh "$TAG" dist
          ls -l dist
      - name: Smoke test the packages
        run: |
          version=${TAG#v}
          sudo dpkg -i "dist/whatchanged_${version}_amd64.deb"
          [ "$(whatchanged --version)" = "whatchanged $version" ]
          dpkg -L whatchanged | grep -q man1/whatchanged.1.gz
          sudo dpkg -r whatchanged
          for image in fedora:latest opensuse/leap:latest; do
            out=$(docker run --rm -v "$PWD/dist:/dist:ro" "$image" sh -c \
              "rpm -i /dist/whatchanged-$version-1.x86_64.rpm && whatchanged --version && whatchanged --since 1d")
            grep -qx "whatchanged $version" <<<"$out"
          done
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" whatchanged[-_]* --clobber
          else
            gh release create "$TAG" whatchanged[-_]* --verify-tag --title "$TAG" \
              --notes "Linux packages for x86_64 and aarch64: .deb (Debian, Ubuntu, Mint), .rpm (Fedora, RHEL, openSUSE) and a static .tar.gz for everything else. Each file has a matching .sha256 file."
          fi
